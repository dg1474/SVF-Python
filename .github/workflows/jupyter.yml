name: Run Notebooks using Built pysvf

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ clang python3-dev nodejs doxygen graphviz lcov libncurses-dev libtinfo6 libzstd-dev

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install wheel pybind11 notebook nbconvert nbclient ipykernel build

      - name: Register Jupyter kernel
        run: |
          python -m ipykernel install --user --name python3

      - name: Build SVF and pysvf via build.sh
        env:
          SVF_REPO: https://github.com/dg1474/SVF.git
          SVF_BRANCH: feat/support-official-llvm-no-rtti
        run: |
          chmod +x ./build.sh
          ./build.sh
          pip install dist/*.whl

      - name: Run notebooks under demo/
        run: |
          python -c "from pathlib import Path; [p.write_text(p.read_text(encoding='utf-8').replace('!pip install pysvf', '# !pip install pysvf'), encoding='utf-8') for p in Path('demo').glob('*.ipynb')]"
          cd demo
          for nb in $(find . -name "*.ipynb"); do
            echo "Executing $nb..."
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=120 "$nb" --stdout > /dev/null
          done
